<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="原理图连接快照">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="30" y="32" font-family="sans-serif" font-size="17" fill="#111">sch.db：instance、terminal、net 组成连接图</text>

  <rect x="40" y="80" width="120" height="64" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="100" y="107" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a8a">PORT_A</text>
  <text x="100" y="127" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">PORT</text>

  <rect x="210" y="80" width="120" height="64" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="270" y="107" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a8a">I1</text>
  <text x="270" y="127" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">INV_X1</text>

  <rect x="390" y="80" width="120" height="64" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="450" y="107" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a8a">I2</text>
  <text x="450" y="127" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">INV_X1</text>

  <rect x="570" y="80" width="120" height="64" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="630" y="107" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a8a">BUF</text>
  <text x="630" y="127" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">BUF_X2</text>

  <rect x="750" y="80" width="120" height="64" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="810" y="107" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a8a">PORT_Y</text>
  <text x="810" y="127" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">PORT</text>

  <text x="154" y="118" font-family="monospace" font-size="11" fill="#334155">P</text>
  <text x="214" y="118" font-family="monospace" font-size="11" fill="#334155">A</text>
  <text x="324" y="118" font-family="monospace" font-size="11" fill="#334155">ZN</text>
  <text x="394" y="118" font-family="monospace" font-size="11" fill="#334155">A</text>
  <text x="504" y="118" font-family="monospace" font-size="11" fill="#334155">ZN</text>
  <text x="574" y="118" font-family="monospace" font-size="11" fill="#334155">A</text>
  <text x="684" y="118" font-family="monospace" font-size="11" fill="#334155">Z</text>
  <text x="754" y="118" font-family="monospace" font-size="11" fill="#334155">P</text>

  <line x1="160" y1="112" x2="210" y2="112" stroke="#16a34a" stroke-width="2"/>
  <text x="185" y="102" text-anchor="middle" font-family="monospace" font-size="12" fill="#15803d">A</text>

  <line x1="330" y1="112" x2="390" y2="112" stroke="#0ea5e9" stroke-width="2"/>
  <text x="360" y="102" text-anchor="middle" font-family="monospace" font-size="12" fill="#0369a1">N1</text>

  <line x1="510" y1="112" x2="540" y2="112" stroke="#f59e0b" stroke-width="2"/>
  <line x1="540" y1="112" x2="540" y2="55" stroke="#f59e0b" stroke-width="2"/>
  <line x1="540" y1="55" x2="810" y2="55" stroke="#f59e0b" stroke-width="2"/>
  <line x1="810" y1="55" x2="810" y2="80" stroke="#f59e0b" stroke-width="2"/>
  <line x1="540" y1="112" x2="570" y2="112" stroke="#f59e0b" stroke-width="2"/>
  <text x="675" y="45" text-anchor="middle" font-family="monospace" font-size="12" fill="#b45309">Y</text>

  <line x1="690" y1="112" x2="735" y2="112" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="741" cy="112" r="5" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="714" y="102" text-anchor="middle" font-family="monospace" font-size="12" fill="#6d28d9">SPARE</text>

  <line x1="630" y1="144" x2="630" y2="188" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="622" y1="180" x2="638" y2="196" stroke="#ef4444" stroke-width="2"/>
  <line x1="638" y1="180" x2="622" y2="196" stroke="#ef4444" stroke-width="2"/>
  <text x="646" y="192" font-family="sans-serif" font-size="12" fill="#b91c1c">悬空 EN</text>

  <text x="40" y="255" font-family="sans-serif" font-size="12" fill="#334155">实线：net；空心圆：未接网络的 pin；红色 ×：悬空 pin。</text>
  <text x="40" y="278" font-family="sans-serif" font-size="12" fill="#64748b">VDD、VSS 也是 terminal，图中省略。PORT_A / PORT_Y 用 PORT 实例表示顶层端口。</text>
  <text x="40" y="315" font-family="sans-serif" font-size="13" fill="#111">查法：先找 net_id，再找 net_id 相同的 terminal，最后 join instances。</text>
</svg>
