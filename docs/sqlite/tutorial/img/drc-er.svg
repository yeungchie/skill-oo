<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="drc.db 的表关系">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="30" y="32" font-family="sans-serif" font-size="17" fill="#111">drc.db 的五张表</text>

  <rect x="40" y="70" width="180" height="100" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="55" y="95" font-family="sans-serif" font-size="14" fill="#1e3a8a">layers</text>
  <text x="55" y="120" font-family="monospace" font-size="12" fill="#334155">layer_id  PK</text>
  <text x="55" y="140" font-family="monospace" font-size="12" fill="#334155">name      UNIQUE</text>
  <text x="55" y="160" font-family="monospace" font-size="12" fill="#334155">purpose</text>

  <rect x="290" y="70" width="180" height="100" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="305" y="95" font-family="sans-serif" font-size="14" fill="#166534">rules</text>
  <text x="305" y="120" font-family="monospace" font-size="12" fill="#334155">rule_id    PK</text>
  <text x="305" y="140" font-family="monospace" font-size="12" fill="#334155">name       UNIQUE</text>
  <text x="305" y="160" font-family="monospace" font-size="12" fill="#334155">severity</text>

  <rect x="540" y="70" width="180" height="100" rx="6" fill="#fefce8" stroke="#eab308"/>
  <text x="555" y="95" font-family="sans-serif" font-size="14" fill="#854d0e">runs</text>
  <text x="555" y="120" font-family="monospace" font-size="12" fill="#334155">run_id     PK</text>
  <text x="555" y="140" font-family="monospace" font-size="12" fill="#334155">label      UNIQUE</text>
  <text x="555" y="160" font-family="monospace" font-size="12" fill="#334155">started_at</text>

  <rect x="230" y="245" width="300" height="145" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="250" y="272" font-family="sans-serif" font-size="15" fill="#991b1b">violations</text>
  <text x="250" y="298" font-family="monospace" font-size="12" fill="#334155">violation_id  PK</text>
  <text x="250" y="318" font-family="monospace" font-size="12" fill="#334155">run_id        FK → runs</text>
  <text x="250" y="338" font-family="monospace" font-size="12" fill="#334155">rule_id       FK → rules</text>
  <text x="250" y="358" font-family="monospace" font-size="12" fill="#334155">layer_id      FK → layers</text>
  <text x="250" y="378" font-family="monospace" font-size="12" fill="#334155">cell, x, y, status, owner</text>

  <rect x="40" y="245" width="160" height="100" rx="6" fill="#faf5ff" stroke="#a855f7"/>
  <text x="55" y="272" font-family="sans-serif" font-size="14" fill="#6b21a8">waivers</text>
  <text x="55" y="298" font-family="monospace" font-size="12" fill="#334155">waiver_id  PK</text>
  <text x="55" y="318" font-family="monospace" font-size="12" fill="#334155">violation_id FK</text>
  <text x="55" y="338" font-family="monospace" font-size="12" fill="#334155">UNIQUE</text>

  <line x1="220" y1="310" x2="230" y2="310" stroke="#64748b" stroke-width="1.5"/>
  <text x="90" y="365" font-family="sans-serif" font-size="12" fill="#64748b">一条违例最多一条豁免</text>

  <line x1="380" y1="170" x2="380" y2="245" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="130" y1="170" x2="330" y2="245" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="630" y1="170" x2="470" y2="245" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="400" y="220" font-family="sans-serif" font-size="12" fill="#166534">一条规则 → 多条违例</text>
  <text x="120" y="220" font-family="sans-serif" font-size="12" fill="#1e3a8a">一个图层 → 多条违例</text>
  <text x="510" y="220" font-family="sans-serif" font-size="12" fill="#854d0e">一次运行 → 多条违例</text>
</svg>
