<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="从宽表到中间表">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="30" y="32" font-family="sans-serif" font-size="17" fill="#111">宽表把关系塞进列名，中间表把关系放回行</text>

  <rect x="30" y="60" width="300" height="190" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="48" y="88" font-family="sans-serif" font-size="14" fill="#334155">一张 block × check 宽表</text>
  <text x="48" y="115" font-family="monospace" font-size="11" fill="#334155">block        DRC  LVS  ANT  EM</text>
  <line x1="48" y1="125" x2="310" y2="125" stroke="#cbd5e1"/>
  <text x="48" y="148" font-family="monospace" font-size="11" fill="#334155">INV_X1       ✓    ✓    ?    W</text>
  <text x="48" y="171" font-family="monospace" font-size="11" fill="#334155">NAND2_X1     ✓    ?    ?    ?</text>
  <text x="48" y="194" font-family="monospace" font-size="11" fill="#334155">BUF_X2       ✓    ✓    ?    ?</text>
  <text x="48" y="217" font-family="monospace" font-size="11" fill="#334155">LEVEL_SHIFT  ?    ?    ?    ?</text>
  <text x="48" y="242" font-family="sans-serif" font-size="12" fill="#64748b">“?” 是没做、没记录，还是不需要？</text>

  <line x1="345" y1="150" x2="395" y2="150" stroke="#64748b" stroke-width="2"/>
  <polygon points="395,150 385,145 385,155" fill="#64748b"/>

  <rect x="420" y="55" width="310" height="105" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="435" y="80" font-family="sans-serif" font-size="13" fill="#1e3a8a">blocks</text>
  <text x="435" y="103" font-family="monospace" font-size="11" fill="#334155">block_id | name | owner</text>
  <text x="435" y="123" font-family="monospace" font-size="11" fill="#334155">1        | INV_X1 | wang</text>

  <rect x="420" y="175" width="310" height="105" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="435" y="200" font-family="sans-serif" font-size="13" fill="#166534">checks</text>
  <text x="435" y="223" font-family="monospace" font-size="11" fill="#334155">check_id | name | category</text>
  <text x="435" y="243" font-family="monospace" font-size="11" fill="#334155">1        | DRC  | physical</text>

  <rect x="420" y="295" width="310" height="80" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="435" y="320" font-family="sans-serif" font-size="13" fill="#991b1b">block_checks（中间表）</text>
  <text x="435" y="343" font-family="monospace" font-size="11" fill="#334155">block_id | check_id | status</text>
  <text x="435" y="363" font-family="monospace" font-size="11" fill="#334155">1        | 1        | signed</text>

  <line x1="575" y1="160" x2="575" y2="295" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="575" y1="280" x2="575" y2="295" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
