<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="把格式里的信息变成显式的列">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="30" y="32" font-family="sans-serif" font-size="17" fill="#111">格式里的信息，要变成列里的值</text>

  <rect x="30" y="60" width="260" height="220" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="48" y="88" font-family="sans-serif" font-size="14" fill="#334155">Excel 单元格</text>
  <rect x="60" y="105" width="190" height="50" fill="#fecaca" stroke="#ef4444"/>
  <text x="80" y="136" font-family="sans-serif" font-size="14" fill="#991b1b">M1.S.1 · INV_X1</text>
  <rect x="60" y="170" width="190" height="60" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="5 3"/>
  <text x="80" y="193" font-family="sans-serif" font-size="13" fill="#92400e">合并单元格</text>
  <text x="80" y="214" font-family="sans-serif" font-size="13" fill="#92400e">只写在第一行</text>
  <text x="60" y="255" font-family="sans-serif" font-size="13" fill="#475569">批注：foundry approved</text>

  <line x1="310" y1="170" x2="365" y2="170" stroke="#64748b" stroke-width="2"/>
  <polygon points="365,170 355,165 355,175" fill="#64748b"/>

  <rect x="390" y="60" width="340" height="240" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="410" y="88" font-family="sans-serif" font-size="14" fill="#166534">数据库表</text>

  <rect x="410" y="105" width="300" height="34" fill="#dcfce7" stroke="#86efac"/>
  <text x="420" y="127" font-family="sans-serif" font-size="12" fill="#166534">violation_id</text>
  <text x="520" y="127" font-family="sans-serif" font-size="12" fill="#166534">status</text>
  <text x="585" y="127" font-family="sans-serif" font-size="12" fill="#166534">rule_id</text>
  <text x="650" y="127" font-family="sans-serif" font-size="12" fill="#166534">note</text>

  <rect x="410" y="139" width="300" height="34" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="420" y="161" font-family="sans-serif" font-size="12" fill="#334155">1</text>
  <text x="520" y="161" font-family="sans-serif" font-size="12" fill="#334155">open</text>
  <text x="585" y="161" font-family="sans-serif" font-size="12" fill="#334155">1</text>
  <text x="650" y="161" font-family="sans-serif" font-size="12" fill="#334155">—</text>

  <rect x="410" y="173" width="300" height="34" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="420" y="195" font-family="sans-serif" font-size="12" fill="#334155">2</text>
  <text x="520" y="195" font-family="sans-serif" font-size="12" fill="#334155">waived</text>
  <text x="585" y="195" font-family="sans-serif" font-size="12" fill="#334155">1</text>
  <text x="650" y="195" font-family="sans-serif" font-size="12" fill="#334155">foundry…</text>

  <text x="410" y="245" font-family="sans-serif" font-size="13" fill="#166534">颜色 → status 列的值</text>
  <text x="410" y="270" font-family="sans-serif" font-size="13" fill="#166534">合并单元格 → 每行都写 key</text>
  <text x="410" y="295" font-family="sans-serif" font-size="13" fill="#166534">批注 → note 或 waivers 表</text>
</svg>
