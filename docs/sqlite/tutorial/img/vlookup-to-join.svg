<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="VLOOKUP 与 JOIN 的对照">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="30" y="32" font-family="sans-serif" font-size="17" fill="#111">VLOOKUP 靠位置找值，JOIN 靠键连表</text>

  <rect x="30" y="60" width="310" height="170" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="48" y="88" font-family="sans-serif" font-size="14" fill="#334155">Excel：公式写死列号</text>
  <text x="48" y="120" font-family="monospace" font-size="12" fill="#1e293b">=VLOOKUP(A2, Rules!A:B, 2, 0)</text>
  <rect x="48" y="140" width="270" height="30" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="58" y="160" font-family="monospace" font-size="12" fill="#1e3a8a">M1.S.1</text>
  <text x="160" y="160" font-family="monospace" font-size="12" fill="#1e3a8a">→ DRC</text>
  <text x="48" y="195" font-family="sans-serif" font-size="12" fill="#64748b">插入一列，公式就错位</text>
  <text x="48" y="215" font-family="sans-serif" font-size="12" fill="#64748b">排序后，引用范围跟着漂</text>

  <line x1="355" y1="145" x2="405" y2="145" stroke="#64748b" stroke-width="2"/>
  <polygon points="405,145 395,140 395,150" fill="#64748b"/>

  <rect x="430" y="60" width="300" height="100" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="448" y="88" font-family="sans-serif" font-size="14" fill="#166534">rules</text>
  <text x="448" y="115" font-family="monospace" font-size="12" fill="#166534">rule_id | name</text>
  <text x="448" y="138" font-family="monospace" font-size="12" fill="#334155">1       | M1.S.1</text>
  <text x="590" y="138" font-family="monospace" font-size="12" fill="#334155">2 | M1.W.1</text>

  <rect x="430" y="185" width="300" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="448" y="213" font-family="sans-serif" font-size="14" fill="#1e3a8a">violations</text>
  <text x="448" y="240" font-family="monospace" font-size="12" fill="#1e3a8a">violation_id | rule_id</text>
  <text x="448" y="263" font-family="monospace" font-size="12" fill="#334155">1            | 1</text>
  <text x="448" y="285" font-family="monospace" font-size="12" fill="#334155">2            | 1</text>

  <line x1="580" y1="160" x2="580" y2="185" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="430" y="325" font-family="sans-serif" font-size="13" fill="#1e3a8a">JOIN 只认 rule_id = rule_id，不认行号。</text>
  <text x="430" y="350" font-family="sans-serif" font-size="13" fill="#1e3a8a">一条规则可以连出很多条违例。</text>
</svg>
