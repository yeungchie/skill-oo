<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="版图图形与包围盒">
  <rect width="760" height="560" fill="#ffffff"/>
  <text x="30" y="32" font-family="sans-serif" font-size="17" fill="#111">layout.db：图形快照与包围盒</text>

  <line x1="120" y1="420" x2="520" y2="420" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="420" x2="120" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="540" y="442" font-family="monospace" font-size="11" fill="#64748b">x</text>
  <text x="104" y="150" font-family="monospace" font-size="11" fill="#64748b">y</text>

  <line x1="120" y1="420" x2="520" y2="420" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="220" y1="420" x2="220" y2="425" stroke="#94a3b8"/>
  <line x1="320" y1="420" x2="320" y2="425" stroke="#94a3b8"/>
  <line x1="420" y1="420" x2="420" y2="425" stroke="#94a3b8"/>
  <line x1="520" y1="420" x2="520" y2="425" stroke="#94a3b8"/>
  <text x="220" y="440" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">0.5</text>
  <text x="320" y="440" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">1.0</text>
  <text x="420" y="440" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">1.5</text>
  <text x="520" y="440" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">2.0</text>
  <text x="120" y="440" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">0</text>
  <text x="104" y="424" text-anchor="end" font-family="monospace" font-size="10" fill="#64748b">0</text>
  <text x="104" y="324" text-anchor="end" font-family="monospace" font-size="10" fill="#64748b">0.5</text>
  <text x="104" y="224" text-anchor="end" font-family="monospace" font-size="10" fill="#64748b">1.0</text>

  <rect x="120" y="220" width="400" height="200" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="160" y="260" width="80" height="120" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="400" y="260" width="80" height="120" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="240,380 400,380 320,260" fill="#fdba74" stroke="#ea580c" stroke-width="1.5"/>

  <line x1="120" y1="180" x2="520" y2="180" stroke="#22c55e" stroke-width="20" opacity="0.55"/>
  <line x1="120" y1="180" x2="520" y2="180" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="190" y="290" width="20" height="20" fill="#a855f7" stroke="#6b21a8" stroke-width="1.5"/>
  <rect x="430" y="290" width="20" height="20" fill="#a855f7" stroke="#6b21a8" stroke-width="1.5"/>

  <rect x="160" y="220" width="80" height="200" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 4"/>
  <rect x="400" y="220" width="80" height="200" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 4"/>

  <rect x="120" y="170" width="400" height="20" fill="#cbd5e1" fill-opacity="0.55" stroke="#475569" stroke-width="1.5"/>
  <line x1="120" y1="180" x2="520" y2="180" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="120" y="170" width="400" height="250" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="126" y="152" font-family="sans-serif" font-size="12" fill="#111827">M1 包围盒：x1=0, y1=0, x2=2, y2=1.25</text>

  <line x1="520" y1="180" x2="532" y2="180" stroke="#15803d" stroke-width="1.5"/>
  <text x="536" y="176" font-family="sans-serif" font-size="12" fill="#166534">M1 path</text>
  <text x="536" y="192" font-family="monospace" font-size="10" fill="#64748b">width 0.1</text>
  <text x="532" y="280" font-family="sans-serif" font-size="12" fill="#6b21a8">V1 via</text>
  <text x="532" y="300" font-family="monospace" font-size="10" fill="#64748b">2 个</text>
  <text x="532" y="370" font-family="sans-serif" font-size="12" fill="#991b1b">PO rect</text>
  <text x="532" y="390" font-family="monospace" font-size="10" fill="#64748b">2 个</text>
  <text x="536" y="208" font-family="sans-serif" font-size="12" fill="#334155">M2 rect</text>

  <text x="150" y="248" font-family="sans-serif" font-size="11" fill="#1e3a8a">M1 rect</text>
  <text x="290" y="352" font-family="sans-serif" font-size="11" fill="#9a3412">M1 polygon</text>
  <text x="150" y="470" font-family="sans-serif" font-size="12" fill="#334155">矩形、多边形、路径、via 都有统一的 bbox；多边形/路径的真实形状在 points 文本里。</text>
  <text x="150" y="496" font-family="sans-serif" font-size="12" fill="#64748b">数据库适合层统计、bbox 预筛和关联；精确相交、布尔、描边交给 OA 或几何库。</text>
  <text x="150" y="522" font-family="sans-serif" font-size="12" fill="#64748b">path 的 bbox 已包含线宽：中心线 y=1.2，width=0.1，所以 y1=1.15、y2=1.25。</text>
</svg>
