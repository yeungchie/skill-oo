<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Region 布尔运算</title>
  <desc id="desc">四个面板展示两个重叠矩形 A、B 的并集、交集、差集与对称差。</desc>
  <defs>
    <style>
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .title { font: 600 15px sans-serif; fill: #0f172a; text-anchor: middle; }
      .formula { font: 13px sans-serif; fill: #64748b; text-anchor: middle; }
      .caption { font: 12px sans-serif; fill: #64748b; text-anchor: middle; }
      .outline { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-linejoin: round; }
      .outline-b { fill: none; stroke: #0f766e; stroke-width: 2.5; stroke-linejoin: round; }
      .outline-b-dash { fill: none; stroke: #0f766e; stroke-width: 2; stroke-dasharray: 5 4; }
      .fill-a { fill: #bfdbfe; }
      .fill-b { fill: #ccfbf1; }
      .fill-ab { fill: #99f6e4; }
      .bg { fill: #f8fafc; }
      .tiny { font: 11px sans-serif; fill: #475569; }
    </style>
  </defs>

  <g>
    <rect class="panel" x="20" y="20" width="220" height="220" rx="10"/>
    <text class="title" x="130" y="46">or</text>
    <text class="formula" x="130" y="70">A &#x222A; B</text>
    <rect class="fill-a" x="50" y="85" width="90" height="95"/>
    <rect class="fill-b" x="105" y="105" width="90" height="95" fill-opacity=".7"/>
    <rect class="outline" x="50" y="85" width="90" height="95"/>
    <rect class="outline-b" x="105" y="105" width="90" height="95"/>
    <text class="caption" x="130" y="215">并集</text>
  </g>

  <g>
    <rect class="panel" x="250" y="20" width="220" height="220" rx="10"/>
    <text class="title" x="360" y="46">and</text>
    <text class="formula" x="360" y="70">A &#x2229; B</text>
    <rect class="outline" x="280" y="85" width="90" height="95"/>
    <rect class="outline-b" x="335" y="105" width="90" height="95"/>
    <rect class="fill-ab" x="335" y="105" width="35" height="75"/>
    <text class="caption" x="360" y="215">交集</text>
  </g>

  <g>
    <rect class="panel" x="480" y="20" width="220" height="220" rx="10"/>
    <text class="title" x="590" y="46">not</text>
    <text class="formula" x="590" y="70">A &#x2212; B</text>
    <rect class="fill-a" x="510" y="85" width="90" height="95"/>
    <rect class="outline" x="510" y="85" width="90" height="95"/>
    <rect class="bg" x="565" y="105" width="90" height="95"/>
    <rect class="outline-b-dash" x="565" y="105" width="90" height="95"/>
    <text class="caption" x="590" y="215">差集</text>
  </g>

  <g>
    <rect class="panel" x="710" y="20" width="220" height="220" rx="10"/>
    <text class="title" x="820" y="46">xor</text>
    <text class="formula" x="820" y="70">A &#x2295; B</text>
    <rect class="fill-a" x="740" y="85" width="90" height="95"/>
    <rect class="fill-b" x="795" y="105" width="90" height="95"/>
    <rect class="bg" x="795" y="105" width="35" height="75"/>
    <rect class="outline" x="740" y="85" width="90" height="95"/>
    <rect class="outline-b" x="795" y="105" width="90" height="95"/>
    <text class="caption" x="820" y="215">对称差</text>
  </g>
</svg>
