<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Direction-aware size</title>
  <desc id="desc">A square expands outward on all four sides; dashed lines show the offset boundary and arrows label left, right, up and down.</desc>
  <defs>
    <marker id="dir-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .original { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .offset { fill: none; stroke: #0f766e; stroke-width: 2; stroke-dasharray: 7 5; }
      .arrow { stroke: #dc2626; stroke-width: 2.5; stroke-linecap: round; }
      .title { font: 600 15px sans-serif; fill: #0f172a; }
      .label { font: 600 13px sans-serif; fill: #dc2626; }
      .note { font: 12px sans-serif; fill: #64748b; }
      .tiny { font: 12px sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" x="20" y="20" width="520" height="320" rx="10"/>
  <text class="title" x="40" y="48">Direction-aware size</text>
  <text class="note" x="40" y="68">The dashed outline is the expanded boundary; ?dir chooses which sides move.</text>

  <rect class="offset" x="135" y="105" width="290" height="190"/>
  <rect class="original" x="170" y="140" width="220" height="120"/>

  <line class="arrow" x1="170" y1="200" x2="110" y2="200" marker-end="url(#dir-arrow)"/>
  <line class="arrow" x1="390" y1="200" x2="450" y2="200" marker-end="url(#dir-arrow)"/>
  <line class="arrow" x1="280" y1="140" x2="280" y2="80" marker-end="url(#dir-arrow)"/>
  <line class="arrow" x1="280" y1="260" x2="280" y2="320" marker-end="url(#dir-arrow)"/>

  <text class="label" x="82" y="205">left</text>
  <text class="label" x="458" y="205">right</text>
  <text class="label" x="290" y="82">up</text>
  <text class="label" x="290" y="330">down</text>

  <text class="tiny" x="185" y="205">original</text>
  <text class="tiny" x="410" y="125">offset</text>
</svg>
