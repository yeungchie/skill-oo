<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-label="线段相交参数 t 与 u">
  <rect width="520" height="220" fill="#ffffff"/>
  <text x="24" y="30" font-family="sans-serif" font-size="15" fill="#111">t 与 u 同时落在 0..1 时两线段才相交</text>

  <line x1="90" y1="170" x2="400" y2="70" stroke="#2563eb" stroke-width="3"/>
  <circle cx="90" cy="170" r="4.5" fill="#2563eb"/>
  <circle cx="400" cy="70" r="4.5" fill="#2563eb"/>
  <text x="66" y="188" font-family="sans-serif" font-size="13" fill="#2563eb">A（t=0）</text>
  <text x="404" y="60" font-family="sans-serif" font-size="13" fill="#2563eb">B（t=1）</text>

  <line x1="110" y1="60" x2="380" y2="185" stroke="#16a34a" stroke-width="3"/>
  <circle cx="110" cy="60" r="4.5" fill="#16a34a"/>
  <circle cx="380" cy="185" r="4.5" fill="#16a34a"/>
  <text x="84" y="52" font-family="sans-serif" font-size="13" fill="#16a34a">C（u=0）</text>
  <text x="386" y="202" font-family="sans-serif" font-size="13" fill="#16a34a">D（u=1）</text>

  <circle cx="248" cy="118" r="6" fill="#111"/>
  <text x="258" y="112" font-family="sans-serif" font-size="13" fill="#111">P</text>
  <text x="180" y="108" font-family="sans-serif" font-size="12" fill="#666">t = 0.5</text>
  <text x="258" y="140" font-family="sans-serif" font-size="12" fill="#666">u = 0.5</text>

  <text x="24" y="208" font-family="sans-serif" font-size="12" fill="#666">t = ((C − A) × s) / (r × s)　　u = ((C − A) × r) / (r × s)</text>
</svg>
