<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-label="综合案例：带槽的板与偏移的凸台">
  <rect width="560" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-family="sans-serif" font-size="15" fill="#111">综合案例：带槽的板与偏移的凸台</text>

  <g font-family="sans-serif" font-size="12">
    <rect x="60" y="84" width="360" height="216" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="132" y="156" width="108" height="72" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="348" y="192" width="108" height="144" fill="#fef3c7" fill-opacity="0.85" stroke="#d97706" stroke-width="2"/>

    <text x="72" y="110" fill="#1e3a8a">板 20 × 12</text>
    <text x="186" y="198" text-anchor="middle" fill="#991b1b">槽 6 × 4</text>
    <text x="402" y="214" text-anchor="middle" fill="#92400e">凸台 6 × 8</text>

    <line x1="348" y1="300" x2="348" y2="336" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="340" y="330" text-anchor="end" fill="#374151">x = 16</text>
    <text x="352" y="330" fill="#6b7280">16.0001</text>

    <line x1="60" y1="344" x2="420" y2="344" stroke="#9ca3af" stroke-width="1"/>
    <line x1="60" y1="340" x2="60" y2="348" stroke="#9ca3af" stroke-width="1"/>
    <line x1="420" y1="340" x2="420" y2="348" stroke="#9ca3af" stroke-width="1"/>
    <text x="240" y="360" text-anchor="middle" fill="#6b7280">20</text>

    <line x1="500" y1="84" x2="500" y2="300" stroke="#9ca3af" stroke-width="1"/>
    <line x1="496" y1="84" x2="504" y2="84" stroke="#9ca3af" stroke-width="1"/>
    <line x1="496" y1="300" x2="504" y2="300" stroke="#9ca3af" stroke-width="1"/>
    <text x="510" y="196" fill="#6b7280">12</text>

    <text x="24" y="386" fill="#6b7280">红色虚线：槽；黄色：凸台；?grid 0.001 把 16.0001 吸回 16。</text>
  </g>
</svg>
