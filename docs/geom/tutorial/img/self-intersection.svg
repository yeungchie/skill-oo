<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-label="急转弯处的自交">
  <rect width="520" height="240" fill="#ffffff"/>
  <text x="24" y="28" font-family="sans-serif" font-size="15" fill="#111">急转弯：内侧偏移线会交叉，交给并集处理</text>

  <polyline points="70,200 230,70 390,200" fill="none" stroke="#bfdbfe" stroke-width="44" stroke-linejoin="miter"/>
  <polyline points="70,200 230,70 390,200" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5 3"/>

  <circle cx="230" cy="140" r="24" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="260" y="146" font-family="sans-serif" font-size="12" fill="#dc2626">内侧重叠</text>

  <text x="24" y="226" font-family="sans-serif" font-size="12" fill="#666">逐段生成边带后求并集，重叠区自动合并，不需要手工裁剪</text>
</svg>
