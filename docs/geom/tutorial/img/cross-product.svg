<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-label="叉积符号示意">
  <rect width="520" height="220" fill="#ffffff"/>
  <text x="24" y="30" font-family="sans-serif" font-size="15" fill="#111">叉积的符号表示点在有向直线的哪一侧</text>

  <line x1="80" y1="170" x2="440" y2="170" stroke="#9ca3af" stroke-width="1"/>
  <line x1="80" y1="60" x2="80" y2="190" stroke="#9ca3af" stroke-width="1"/>

  <circle cx="100" cy="160" r="4" fill="#374151"/>
  <text x="86" y="178" font-family="sans-serif" font-size="12" fill="#374151">A</text>

  <line x1="100" y1="160" x2="380" y2="160" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="380,160 368,154 368,166" fill="#2563eb"/>
  <text x="390" y="165" font-family="sans-serif" font-size="13" fill="#2563eb">B</text>

  <line x1="100" y1="160" x2="290" y2="70" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="290,70 277,72 283,82" fill="#16a34a"/>
  <text x="298" y="68" font-family="sans-serif" font-size="13" fill="#16a34a">C</text>

  <path d="M 190 160 A 90 90 0 0 0 176 128" fill="none" stroke="#16a34a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="200" y="140" font-family="sans-serif" font-size="12" fill="#16a34a">逆时针，左侧</text>

  <line x1="100" y1="160" x2="250" y2="205" stroke="#dc2626" stroke-width="2.5"/>
  <text x="256" y="212" font-family="sans-serif" font-size="13" fill="#dc2626">D，右侧</text>

  <text x="24" y="52" font-family="sans-serif" font-size="13" fill="#666">a × b = ax·by − ay·bx</text>
  <text x="330" y="52" font-family="sans-serif" font-size="13" fill="#666">符号 → 左右；零 → 共线</text>
</svg>
