<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-label="网格吸附前后对比">
  <rect width="520" height="240" fill="#ffffff"/>
  <text x="24" y="28" font-family="sans-serif" font-size="15" fill="#111">网格吸附：把「接近」变成「同一条边」</text>

  <text x="40" y="58" font-family="sans-serif" font-size="13" fill="#666">吸附前：缝隙 0.01</text>
  <rect x="40" y="72" width="100" height="110" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="146" y="72" width="94" height="110" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <line x1="140" y1="196" x2="146" y2="196" stroke="#dc2626" stroke-width="1.5"/>
  <text x="118" y="214" font-family="sans-serif" font-size="12" fill="#dc2626">0.01</text>
  <text x="60" y="226" font-family="sans-serif" font-size="12" fill="#666">结果是两块独立多边形</text>

  <text x="290" y="58" font-family="sans-serif" font-size="13" fill="#666">?grid 0.1 之后</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="290" y1="72" x2="290" y2="182"/>
    <line x1="310" y1="72" x2="310" y2="182"/>
    <line x1="330" y1="72" x2="330" y2="182"/>
    <line x1="350" y1="72" x2="350" y2="182"/>
    <line x1="370" y1="72" x2="370" y2="182"/>
    <line x1="390" y1="72" x2="390" y2="182"/>
    <line x1="410" y1="72" x2="410" y2="182"/>
    <line x1="430" y1="72" x2="430" y2="182"/>
    <line x1="450" y1="72" x2="450" y2="182"/>
    <line x1="470" y1="72" x2="470" y2="182"/>
    <line x1="290" y1="72" x2="490" y2="72"/>
    <line x1="290" y1="92" x2="490" y2="92"/>
    <line x1="290" y1="112" x2="490" y2="112"/>
    <line x1="290" y1="132" x2="490" y2="132"/>
    <line x1="290" y1="152" x2="490" y2="152"/>
    <line x1="290" y1="172" x2="490" y2="172"/>
  </g>
  <rect x="300" y="72" width="170" height="110" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="214" font-family="sans-serif" font-size="12" fill="#666">缝隙消失，结果是一块</text>
</svg>
