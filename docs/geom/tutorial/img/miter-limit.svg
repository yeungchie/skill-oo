<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-label="miter limit 的作用">
  <rect width="520" height="240" fill="#ffffff"/>
  <text x="24" y="28" font-family="sans-serif" font-size="15" fill="#111">miter limit：夹角很小时，尖角会伸得很远</text>

  <polyline points="40,190 220,150 40,110" fill="none" stroke="#bfdbfe" stroke-width="24" stroke-linejoin="miter"/>
  <polyline points="40,190 220,150 40,110" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="34" y="222" font-family="sans-serif" font-size="12" fill="#666">miter：两条偏移线求交</text>
  <text x="196" y="130" font-family="sans-serif" font-size="12" fill="#dc2626">伸出很远</text>

  <polyline points="290,190 470,150 290,110" fill="none" stroke="#bfdbfe" stroke-width="24" stroke-linejoin="bevel"/>
  <polyline points="290,190 470,150 290,110" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="284" y="222" font-family="sans-serif" font-size="12" fill="#666">bevel：超过 limit 后退回平切</text>
</svg>
