<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="布尔流水线">
  <rect width="520" height="300" fill="#ffffff"/>
  <text x="24" y="28" font-family="sans-serif" font-size="15" fill="#111">区域布尔运算的六个阶段</text>

  <g font-family="sans-serif" font-size="13">
    <rect x="170" y="46" width="180" height="30" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="260" y="66" text-anchor="middle" fill="#1e3a8a">1 拆边：交点切段</text>

    <rect x="170" y="86" width="180" height="30" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="260" y="106" text-anchor="middle" fill="#1e3a8a">2 分类：两侧采样</text>

    <rect x="170" y="126" width="180" height="30" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="260" y="146" text-anchor="middle" fill="#1e3a8a">3 追踪：接成闭环</text>

    <rect x="170" y="166" width="180" height="30" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="260" y="186" text-anchor="middle" fill="#1e3a8a">4 嵌套：区分外环与洞</text>

    <rect x="170" y="206" width="180" height="30" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="260" y="226" text-anchor="middle" fill="#1e3a8a">5 拼接：切割线并入外环</text>

    <rect x="170" y="246" width="180" height="30" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="260" y="266" text-anchor="middle" fill="#1e3a8a">6 规范化：去重、定向</text>
  </g>

  <g stroke="#6b7280" stroke-width="1.5">
    <line x1="260" y1="76" x2="260" y2="86"/>
    <line x1="260" y1="116" x2="260" y2="126"/>
    <line x1="260" y1="156" x2="260" y2="166"/>
    <line x1="260" y1="196" x2="260" y2="206"/>
    <line x1="260" y1="236" x2="260" y2="246"/>
  </g>

  <text x="380" y="106" font-family="sans-serif" font-size="12" fill="#6b7280">保留哪条边由运算决定</text>
  <text x="380" y="146" font-family="sans-serif" font-size="12" fill="#6b7280">内部分配一致</text>
  <text x="380" y="186" font-family="sans-serif" font-size="12" fill="#6b7280">奇偶深度</text>
</svg>
