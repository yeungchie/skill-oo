<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-label="平移参考点降低误差">
  <defs>
    <marker id="as" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="520" height="240" fill="#ffffff"/>
  <text x="24" y="28" font-family="sans-serif" font-size="15" fill="#111">平移参考点：把乘积从「坐标平方」降到「尺寸平方」</text>

  <polygon points="80,180 180,180 80,110" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="204" font-family="sans-serif" font-size="12" fill="#666">坐标 ~10</text>
  <text x="70" y="222" font-family="sans-serif" font-size="12" fill="#666">乘积 ~10²，误差可忽略</text>

  <line x1="230" y1="140" x2="290" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#as)"/>
  <text x="228" y="128" font-family="sans-serif" font-size="12" fill="#2563eb">减去 (x0, y0)</text>

  <polygon points="330,180 430,180 330,110" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="204" font-family="sans-serif" font-size="12" fill="#666">坐标 ~1e9</text>
  <text x="300" y="222" font-family="sans-serif" font-size="12" fill="#dc2626">乘积 ~1e18，相邻浮点差约 128</text>
</svg>
