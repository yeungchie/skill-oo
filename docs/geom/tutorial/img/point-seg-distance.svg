<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-label="点到线段的距离">
  <rect width="520" height="220" fill="#ffffff"/>
  <text x="24" y="28" font-family="sans-serif" font-size="15" fill="#111">点到线段：先投影，再把参数夹到 0..1</text>

  <line x1="70" y1="150" x2="430" y2="150" stroke="#2563eb" stroke-width="3"/>
  <circle cx="70" cy="150" r="4.5" fill="#2563eb"/>
  <circle cx="430" cy="150" r="4.5" fill="#2563eb"/>
  <text x="56" y="168" font-family="sans-serif" font-size="13" fill="#2563eb">A</text>
  <text x="436" y="168" font-family="sans-serif" font-size="13" fill="#2563eb">B</text>

  <circle cx="300" cy="60" r="5" fill="#dc2626"/>
  <text x="288" y="50" font-family="sans-serif" font-size="13" fill="#dc2626">P</text>
  <line x1="300" y1="60" x2="300" y2="150" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="300" cy="150" r="4" fill="#dc2626"/>
  <text x="306" y="140" font-family="sans-serif" font-size="12" fill="#dc2626">垂足（t 在 0..1）</text>

  <circle cx="480" cy="80" r="5" fill="#16a34a"/>
  <text x="474" y="70" font-family="sans-serif" font-size="13" fill="#16a34a">Q</text>
  <line x1="480" y1="80" x2="430" y2="150" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="300" y="196" font-family="sans-serif" font-size="12" fill="#16a34a">投影落在段外，取最近端点 B</text>

  <text x="24" y="112" font-family="sans-serif" font-size="12" fill="#666">t = ((P − A)·(B − A)) / |B − A|²</text>
</svg>
