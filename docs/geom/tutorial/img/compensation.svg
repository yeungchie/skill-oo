<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-label="补偿求和">
  <defs>
    <marker id="acm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="520" height="220" fill="#ffffff"/>
  <text x="24" y="28" font-family="sans-serif" font-size="15" fill="#111">补偿求和：把每步丢掉的低位单独存起来</text>

  <rect x="50" y="70" width="80" height="32" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="90" y="91" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a8a">term</text>

  <rect x="180" y="70" width="80" height="32" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="220" y="91" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e3a8a">sum</text>

  <rect x="310" y="70" width="90" height="32" rx="5" fill="#fef2f2" stroke="#dc2626"/>
  <text x="355" y="91" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991b1b">comp</text>

  <rect x="180" y="160" width="120" height="32" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="240" y="181" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">sum + comp</text>

  <g stroke="#6b7280" stroke-width="1.5" marker-end="url(#acm)">
    <line x1="130" y1="86" x2="178" y2="86"/>
    <line x1="260" y1="86" x2="308" y2="86"/>
    <line x1="220" y1="102" x2="220" y2="158"/>
    <line x1="355" y1="102" x2="355" y2="140"/>
    <line x1="355" y1="140" x2="300" y2="176"/>
  </g>

  <text x="262" y="66" font-family="sans-serif" font-size="11" fill="#666">舍入误差</text>
  <text x="24" y="210" font-family="sans-serif" font-size="12" fill="#666">最后统一补回，面积不会因为低位丢失而变成 0</text>
</svg>
