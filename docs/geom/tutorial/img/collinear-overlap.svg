<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-label="共线重叠的交集">
  <rect width="520" height="200" fill="#ffffff"/>
  <text x="24" y="28" font-family="sans-serif" font-size="15" fill="#111">共线：交集是一段线段，不是一个点</text>

  <rect x="200" y="96" width="120" height="24" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <line x1="60" y1="108" x2="320" y2="108" stroke="#2563eb" stroke-width="4"/>
  <line x1="200" y1="108" x2="460" y2="108" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 4"/>

  <circle cx="60" cy="108" r="4" fill="#2563eb"/>
  <circle cx="320" cy="108" r="4" fill="#2563eb"/>
  <circle cx="200" cy="108" r="4" fill="#16a34a"/>
  <circle cx="460" cy="108" r="4" fill="#16a34a"/>
  <text x="48" y="132" font-family="sans-serif" font-size="12" fill="#2563eb">A</text>
  <text x="322" y="132" font-family="sans-serif" font-size="12" fill="#2563eb">B</text>
  <text x="196" y="146" font-family="sans-serif" font-size="12" fill="#16a34a">C</text>
  <text x="456" y="146" font-family="sans-serif" font-size="12" fill="#16a34a">D</text>

  <text x="212" y="88" font-family="sans-serif" font-size="12" fill="#b45309">重叠部分</text>
  <text x="24" y="180" font-family="sans-serif" font-size="12" fill="#666">Segment->intersection 返回重叠的线段；平行不相交才返回 nil</text>
</svg>
