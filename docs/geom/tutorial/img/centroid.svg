<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-label="面积加权质心">
  <rect width="520" height="240" fill="#ffffff"/>
  <text x="24" y="28" font-family="sans-serif" font-size="15" fill="#111">质心：每个有向三角形按自己的面积加权</text>

  <polygon points="160,60 360,80 340,200 140,180" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="80" cy="210" r="4" fill="#111"/>
  <text x="64" y="228" font-family="sans-serif" font-size="12" fill="#111">O（参考点）</text>

  <g stroke="#93c5fd" stroke-width="1" stroke-dasharray="4 3">
    <line x1="80" y1="210" x2="160" y2="60"/>
    <line x1="80" y1="210" x2="360" y2="80"/>
    <line x1="80" y1="210" x2="340" y2="200"/>
    <line x1="80" y1="210" x2="140" y2="180"/>
  </g>

  <circle cx="252" cy="132" r="7" fill="#dc2626"/>
  <text x="262" y="128" font-family="sans-serif" font-size="13" fill="#dc2626">C</text>

  <text x="380" y="120" font-family="sans-serif" font-size="12" fill="#666">Cx = Σ(xᵢ+xᵢ₊₁)·crossᵢ / (6A)</text>
  <text x="380" y="142" font-family="sans-serif" font-size="12" fill="#666">Cy = Σ(yᵢ+yᵢ₊₁)·crossᵢ / (6A)</text>
  <text x="380" y="172" font-family="sans-serif" font-size="12" fill="#666">先平移参考点再累加</text>
</svg>
