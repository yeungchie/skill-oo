<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img" aria-label="面积加权质心">
  <rect width="520" height="250" fill="#ffffff"/>
  <text x="24" y="28" font-family="sans-serif" font-size="15" fill="#111">质心：每个有向三角形按自己的面积加权</text>

  <polygon points="160,60 360,80 340,190 140,170" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="80" cy="200" r="4" fill="#111"/>
  <text x="58" y="218" font-family="sans-serif" font-size="12" fill="#111">O（参考点）</text>

  <g stroke="#93c5fd" stroke-width="1" stroke-dasharray="4 3">
    <line x1="80" y1="200" x2="160" y2="60"/>
    <line x1="80" y1="200" x2="360" y2="80"/>
    <line x1="80" y1="200" x2="340" y2="190"/>
    <line x1="80" y1="200" x2="140" y2="170"/>
  </g>

  <circle cx="252" cy="128" r="7" fill="#dc2626"/>
  <text x="262" y="124" font-family="sans-serif" font-size="13" fill="#dc2626">C</text>

  <text x="24" y="232" font-family="sans-serif" font-size="11" fill="#666">Cx = Σ(xᵢ+xᵢ₊₁)·crossᵢ / (6A)；Cy 同理。先平移参考点再累加。</text>
</svg>
