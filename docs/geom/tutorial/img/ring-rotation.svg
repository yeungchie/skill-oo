<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-label="环键的旋转与方向归一">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="520" height="240" fill="#ffffff"/>
  <text x="24" y="28" font-family="sans-serif" font-size="15" fill="#111">环键：旋转与方向不同，归一后是同一个串</text>

  <g stroke="#2563eb" stroke-width="2" fill="#eff6ff">
    <rect x="60" y="70" width="80" height="80"/>
    <rect x="220" y="70" width="80" height="80"/>
    <rect x="380" y="70" width="80" height="80"/>
  </g>

  <circle cx="60" cy="70" r="5" fill="#dc2626"/>
  <circle cx="300" cy="70" r="5" fill="#dc2626"/>
  <circle cx="380" cy="70" r="5" fill="#dc2626"/>

  <path d="M 60 150 A 80 80 0 0 1 140 70" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 220 150 A 80 80 0 0 1 300 70" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 380 70 A 80 80 0 0 0 460 150" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="66" y="176" font-family="sans-serif" font-size="12" fill="#666">起点 A</text>
  <text x="226" y="176" font-family="sans-serif" font-size="12" fill="#666">起点 B</text>
  <text x="386" y="176" font-family="sans-serif" font-size="12" fill="#666">反向</text>

  <text x="176" y="214" font-family="sans-serif" font-size="13" fill="#111">都取字典序最小的写法 → 同一个环键</text>
</svg>
