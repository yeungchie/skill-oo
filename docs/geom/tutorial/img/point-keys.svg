<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-label="网格吸附与点键">
  <rect width="520" height="220" fill="#ffffff"/>
  <text x="24" y="28" font-family="sans-serif" font-size="15" fill="#111">吸附到网格后，相近坐标得到同一个键</text>

  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="80" y1="60" x2="80" y2="200"/>
    <line x1="140" y1="60" x2="140" y2="200"/>
    <line x1="200" y1="60" x2="200" y2="200"/>
    <line x1="260" y1="60" x2="260" y2="200"/>
    <line x1="320" y1="60" x2="320" y2="200"/>
    <line x1="380" y1="60" x2="380" y2="200"/>
    <line x1="80" y1="60" x2="380" y2="60"/>
    <line x1="80" y1="110" x2="380" y2="110"/>
    <line x1="80" y1="160" x2="380" y2="160"/>
    <line x1="80" y1="200" x2="380" y2="200"/>
  </g>

  <circle cx="204" cy="106" r="4" fill="#dc2626"/>
  <circle cx="208" cy="112" r="4" fill="#dc2626"/>
  <path d="M 204 106 L 200 110" stroke="#dc2626" stroke-width="1" stroke-dasharray="2 2"/>
  <path d="M 208 112 L 200 110" stroke="#dc2626" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="200" cy="110" r="6" fill="none" stroke="#111" stroke-width="1.5"/>

  <text x="212" y="100" font-family="sans-serif" font-size="12" fill="#dc2626">两个近似点</text>
  <text x="186" y="132" font-family="sans-serif" font-size="12" fill="#111">键 "3|2"</text>

  <circle cx="326" cy="164" r="5" fill="#16a34a"/>
  <text x="336" y="168" font-family="sans-serif" font-size="12" fill="#16a34a">键 "5|1"</text>

  <text x="400" y="80" font-family="sans-serif" font-size="12" fill="#666">格点 = 键</text>
  <text x="400" y="100" font-family="sans-serif" font-size="12" fill="#666">"ix|iy"</text>
  <text x="400" y="140" font-family="sans-serif" font-size="12" fill="#666">g 越小</text>
  <text x="400" y="158" font-family="sans-serif" font-size="12" fill="#666">键越密</text>
</svg>
